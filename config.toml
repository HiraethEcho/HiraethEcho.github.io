# The URL the site will be built for
base_url = "https://keinmal.top"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = false

title = "王延泽"

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = false

# Default language (content/ root)
default_language = "zh"

[translations]
Biography = "简介"
Interests = "兴趣"
Education = "教育"
toc = "目录"
Published = "发表"
Abstract = "摘要"
volume = "卷"
number = "期"
pages = "页"

[languages.en]
title = "Yanze Wang"

[languages.en.translations]
Biography = "Biography"
Interests = "Interests"
Education = "Education"
toc = "Table of Contents"
Published = "Published"
Abstract = "Abstract"
volume = "volume"
number = "number"
pages = "pages"

# Various slugification strategies, see below for details
# Defaults to everything being a slug
[slugify]
paths = "on"
taxonomies = "on"
anchors = "on"

[markdown.highlighting]
# Whether to do syntax highlighting
# Theme can be customised by setting the `theme` variable to a theme supported by Zola
theme = "one-dark-pro"

[extra]
header_title = "主页"
bio_title = "王延泽"
subtitle = "数学博士生"
avatar = "img/avatar.jpg"
favicon = "img/avatar.jpg"
# Enter your email
email = "wyz2016zxc[at]outlook.com"
# Language switch links in nav (order matters)
language_codes = ["en", "zh"]
menu_items = [
   { path = "/about", name = "关于" },
]

# Per-language overrides (accessed as config.extra[lang] in templates)
[extra.en]
header_title = "Home"
bio_title = "Yanze Wang"
subtitle = "Mathematics PhD Candidate"
avatar = "img/avatar.jpg"
favicon = "img/avatar.jpg"
menu_items = [
   { path = "/about", name = "About" },
]
